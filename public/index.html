<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7d94a6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="教学助手">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>教学助手</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="logo">📚 教学助手</div>
      <nav id="nav">
        <a href="#/" data-route="/" data-icon="🏠" class="nav-item active">🏠 首页</a>
        <a href="#/lesson-plans" data-route="/lesson-plans" data-icon="📝" class="nav-item">📝 备课</a>
        <a href="#/research" data-route="/research" data-icon="🔬" class="nav-item">🔬 教研</a>
        <a href="#/knowledge" data-route="/knowledge" data-icon="🧠" class="nav-item">🧠 知识点</a>
        <a href="#/questions" data-route="/questions" data-icon="❓" class="nav-item">❓ 题库</a>
        <a href="#/papers" data-route="/papers" data-icon="📄" class="nav-item">📄 试卷</a>
        <a href="#/students" data-route="/students" data-icon="👨‍🎓" class="nav-item">👨‍🎓 学生</a>
        <a href="#/courses" data-route="/courses" data-icon="📅" class="nav-item">📅 课程表</a>
        <a href="#/settings" data-route="/settings" data-icon="⚙️" class="nav-item">⚙️ 设置</a>
      </nav>
    </aside>
    <main id="main">
      <header id="topbar">
        <h1 id="page-title">首页</h1>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <!-- 模态框容器 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">标题</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/pages/auth.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/knowledge.js"></script>
  <script src="/js/pages/questions.js"></script>
  <script src="/js/pages/papers.js"></script>
  <script src="/js/pages/lessonPlans.js"></script>
  <script src="/js/pages/research.js"></script>
  <script src="/js/pages/students.js"></script>
  <script src="/js/pages/courses.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // 注册 Service Worker（PWA 支持）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW 注册失败:', err);
        });
      });
    }
  </script>
</body>
</html>
